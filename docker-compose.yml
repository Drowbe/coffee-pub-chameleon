# Coffee Pub Chameleon: paste into QNAP Container Station (Applications > Create) or `docker compose up -d`.
# Replace every CHANGE_ME. Never paste this file anywhere with the secrets filled in.
#
# DNS (to your public IP, DNS only): CHANGE_ME_BASE_DOMAIN and *.CHANGE_ME_BASE_DOMAIN (environments at
#   <slug>.CHANGE_ME_BASE_DOMAIN, the console at admin.CHANGE_ME_BASE_DOMAIN), and livekit.CHANGE_ME_DOMAIN.
# Router: forward 7881/tcp, 7882/udp and 3478/udp to the NAS.
# Proxy (TLS): the app host and *.CHANGE_ME_BASE_DOMAIN -> NAS:3000; livekit.CHANGE_ME_DOMAIN -> NAS:7880 (Websockets ON).
version: "3.7"

services:
  livekit:
    image: livekit/livekit-server:latest # voice and video (1.12 or newer); the app starts without it
    container_name: chameleon-livekit
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        turn:
          enabled: true
          domain: livekit.CHANGE_ME_DOMAIN
          udp_port: 3478
        keys:
          CHANGE_ME_API_KEY: CHANGE_ME_API_SECRET
        logging:
          level: info

  chameleon:
    # The repository and image keep their old name for now (renamed in a later step).
    # Pin the tag: the first 7 characters of the commit on the GitHub Actions run you want (sha-1a2b3c4).
    # Never :latest on a NAS: it reuses the copy it cached and you run an old build.
    image: ghcr.io/drowbe/coffee-pub-collaborator:sha-CHANGE_ME
    container_name: chameleon-app
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "3000:3000/tcp"
    environment:
      # LiveKit. The host must be the same as the livekit service's turn: domain above. Key and secret = its keys: line.
      LIVEKIT_HOST: "livekit.CHANGE_ME_DOMAIN"
      LIVEKIT_API_KEY: "CHANGE_ME_API_KEY"
      LIVEKIT_API_SECRET: "CHANGE_ME_API_SECRET"
      # The admin. Its password is set to this on every start: change it here and recreate to rotate it.
      ADMIN_LOGIN: "CHANGE_ME_ADMIN_LOGIN"
      ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
      PRODUCT_NAME: "Coffee Pub Chameleon"
      # CONTACT_EMAIL: "you@example.com" # optional: where the product page's "ask" writes to
      # Several environments: set the base domain (unset, one environment). PRODUCT_DOMAIN puts the product page on its own host.
      # BASE_DOMAIN: "CHANGE_ME_BASE_DOMAIN"
      # PRODUCT_DOMAIN: "CHANGE_ME_PRODUCT_HOST"
      # Two-step sign-in. If an owner or admin is locked out: bypass "true", sign in, reset the factor, set it back.
      ENABLE_MFA: "true"
      ADMIN_MFA_LOCKOUT_BYPASS: "false"
      # The Vault's files live in their own folder, so the in-app backups stay small. Back up both folders together.
      VAULT_DIR: "/app/vault"
      PORT: "3000"
    volumes:
      - /share/appdata/coffee-pub-chameleon:/app/data # users, settings and images
      - /share/appdata/coffee-pub-chameleon-vault:/app/vault # the Vault's files (can be large)

# Every other setting: see the guide's Settings reference.
