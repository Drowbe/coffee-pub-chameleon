<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<!--
  The board fills the module. #world is the layer the view moves and scales; each block is a .wb-block in it, drawn by its
  block type (whiteboard-lib-e-block-*.js). #frame is the selection's frame, drawn over the selected block (or round all of them, when several are).
  #drop shows while files are dragged over the board; #picker is the file chooser behind "Add a picture" in the +.
  #present is the bar shown while the frames are presented (Back, which frame of how many, Next, Exit).
  #find is the find bar (Find in the title bar's menu, or /): the words to find, how many there are, Previous, Next, Close.
  #paint is the strip of the colours and the line width, hung under the toolbar's left end (whiteboard.js fills it).
  The timer is a clock the script puts in #board (over the world, not in it). #say reads out a timer starting, pausing and ending; #editor asks for a timer's own length (Custom). While words are
  edited, the formatting bar (.wb-format) is put on #board by the editor (whiteboard-lib-d-render.js).
  The host draws the title bar (the +, the zoom buttons), the toolbar (the tools, Undo, Redo, Delete, Snap to grid) and
  the status line. The board's spoken help (its aria-label) is set by whiteboard.js, in the words of the device: the keys
  only where there is a keyboard.
-->
<div id="app" class="app sdk-slot" hidden>
  <div id="paint" class="wb-paint" role="group" aria-label="Colours and line width" hidden></div>
  <div id="board" class="board" tabindex="0" role="application" aria-roledescription="whiteboard" aria-label="Whiteboard">
    <div id="world" class="world">
      <div id="frame" class="wb-frame" hidden></div>
    </div>
    <p id="hint" class="hint" hidden></p>
    <div id="drop" class="wb-drop" hidden><p class="wb-drop-title">Drop to add to the board</p><p id="drop-sub" class="wb-drop-sub"></p></div>
    <div id="present" class="wb-present" role="toolbar" aria-label="Presenting the frames" hidden>
      <button type="button" id="present-back" class="btn btn-quiet btn-small" aria-label="Back"><span class="ic" data-icon="chevron-left" aria-hidden="true"></span><span class="wb-present-label">Back</span></button>
      <span id="present-count" class="wb-present-count"></span>
      <button type="button" id="present-next" class="btn btn-quiet btn-small" aria-label="Next"><span class="wb-present-label">Next</span><span class="ic" data-icon="chevron-right" aria-hidden="true"></span></button>
      <button type="button" id="present-exit" class="btn btn-small" aria-label="Exit"><span class="ic" data-icon="xmark" aria-hidden="true"></span><span class="wb-present-label">Exit</span></button>
    </div>
    <div id="find" class="wb-find" role="search" aria-label="Find in the board" hidden>
      <input id="find-input" class="wb-find-input" type="text" maxlength="100" placeholder="Find" aria-label="Find in the board" aria-describedby="find-count" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <span id="find-count" class="wb-find-count"></span>
      <button type="button" id="find-prev" class="sdk-icon-btn btn-quiet btn-small" aria-label="Previous" data-tip="Previous"><span class="ic" aria-hidden="true"></span></button>
      <button type="button" id="find-next" class="sdk-icon-btn btn-quiet btn-small" aria-label="Next" data-tip="Next"><span class="ic" aria-hidden="true"></span></button>
      <button type="button" id="find-close" class="sdk-icon-btn btn-quiet btn-small" aria-label="Close" data-tip="Close"><span class="ic" aria-hidden="true"></span></button>
    </div>
  </div>
  <input id="picker" type="file" accept="image/*" multiple hidden>
  <p id="say" class="wb-say" aria-live="polite"></p>
  <dialog id="editor" class="sdk-editor">
    <form id="custom-form" class="sdk-form">
      <h3 id="custom-title">Timer length</h3>
      <div class="sdk-form-row">
        <label class="sdk-field sdk-s"><span class="sdk-label">Minutes</span><input id="custom-min" type="number" min="0" max="1439" step="1" inputmode="numeric"><span class="sdk-hint"></span></label>
        <label class="sdk-field sdk-s"><span class="sdk-label">Seconds</span><input id="custom-sec" type="number" min="0" max="59" step="1" inputmode="numeric"><span class="sdk-hint"></span></label>
      </div>
      <div class="sdk-form-error" id="custom-error" role="alert" hidden></div>
      <div class="sdk-editor-actions">
        <button class="btn btn-quiet" type="button" id="custom-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="custom-save">Set length</button>
      </div>
    </form>
  </dialog>
  <dialog id="export" class="sdk-editor">
    <form id="export-form" class="sdk-form">
      <h3 id="export-title">Save as image</h3>
      <label class="sdk-field"><span class="sdk-label">What to save</span><select id="export-what"></select><span class="sdk-hint"></span></label>
      <div class="sdk-form-row">
        <label class="sdk-field sdk-m"><span class="sdk-label">Background</span><select id="export-bg"><option value="page">Board colour</option><option value="none">Transparent</option></select><span class="sdk-hint"></span></label>
        <label class="sdk-field sdk-m"><span class="sdk-label">Size</span><select id="export-scale"><option value="1">Normal (1x)</option><option value="2">Double (2x)</option></select><span class="sdk-hint"></span></label>
      </div>
      <p id="export-size" class="wb-export-size" aria-live="polite"></p>
      <div class="sdk-form-error" id="export-error" role="alert" hidden></div>
      <div class="sdk-editor-actions">
        <button class="btn btn-quiet" type="button" id="export-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="export-save">Save</button>
      </div>
    </form>
  </dialog>
  <div id="print" class="wb-print" aria-hidden="true"></div>
</div>
<div id="loading" class="msg" aria-busy="true"><div class="sdk-skel sdk-skel-block"></div></div>
<div id="msg" class="sdk-empty" hidden></div>
<script>
/*__JS__*/
</script>
</body>
</html>
