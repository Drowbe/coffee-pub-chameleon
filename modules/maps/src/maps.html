<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<!--
  The window holds two views of the same places: the list (the places, grouped, with Add a place) and the map. The script fills a clone by hooks only:
    [data-slot=name]   set its textContent (or hide it when there is no value)
    [data-icon=name]   replace its content with host.ui.icon(name)
  and toggles the state classes and data attributes listed in CONTRACT.md. It builds no markup from strings and never sets a style (the map
  library positions the pins; the place menu is put under its button). #window's data-mode says which show: list, map, or both side by side.
  The reference renderings are design/map.html and design/list.html.
-->
<div id="window" class="sdk-slot window" data-mode="list">
  <section id="map-view" class="view view-map" aria-label="Map">
<div id="map-app" class="app" hidden>
  <div class="map-area">
    <div id="map" class="map"></div>
    <!-- what a search found (the search is the host's toolbar field): over the top of the map, under the toolbar -->
    <ul class="results sdk-menu" id="results" role="listbox" hidden></ul>
    <div class="maplibregl-ctrl-top-right" id="ctrl-zoom"></div>
    <div class="maplibregl-ctrl-bottom-right"><div class="attribution" data-slot="attribution"><span data-slot="osm">&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</span></div></div>
    <div class="sdk-banner" id="banner" data-kind="info" hidden><span class="sdk-banner-icon" data-icon="crosshairs" aria-hidden="true"></span><span class="sdk-banner-text" data-slot="text">Click the map to place it</span><button class="btn btn-small sdk-banner-action" type="button" data-action="cancel">Cancel</button></div>
    <div id="callout" class="callout-box" hidden></div>
    <div id="state" class="sdk-empty" hidden></div>
  </div>
  <p class="sdk-form-error" id="map-note" hidden></p>

</div>
<div id="map-loading" class="msg" aria-busy="true"><div class="sdk-skel-list"><div class="sdk-skel sdk-skel-block"></div><div class="sdk-skel sdk-skel-block"></div><div class="sdk-skel sdk-skel-block"></div></div></div>
<div id="map-msg" class="sdk-empty" hidden></div>
  </section>
  <section id="list-view" class="view view-list" aria-label="Places">
    <!-- shown while no map file is set: the list is the window; this says why there is no map -->
    <div class="sdk-banner" data-kind="info" id="list-nomap" hidden><span class="sdk-banner-icon" data-icon="map" aria-hidden="true"></span><span class="sdk-banner-text">No map yet. <span data-word="owner" data-word-form="a cap"></span> ticks a map file in Manage to draw one.</span></div>
<div id="list-app" class="list-app" hidden>
  <p class="view-note" data-slot="view-note" hidden><span class="ic" data-icon="circle-info"></span><span data-slot="text"></span></p>
  <p class="sdk-form-error" id="list-note" hidden></p>
  <main id="body" class="body"></main>
  <!-- the results of a search, over the foot of the pane while there are some (the script fills it from the tpl-found-* templates) -->
  <div id="found" class="sdk-card-banded found" role="listbox" aria-label="Search results" hidden></div>

  <!-- a place, in the editor window (host.ui.editor: a modal dialog over everything, never clipped by the module's box): a form for
       someone who may edit, read-only for anyone else (the script fills #f-* and shows .readonly instead) -->
  <dialog id="editor" class="sdk-editor">
    <form id="form" class="sdk-form">
      <h3 id="editor-title">Add a place</h3>
      <div class="sdk-hint" id="f-readonly" hidden></div>
      <label class="sdk-field"><span class="sdk-label">Name</span><input id="f-title" name="title" type="text" maxlength="120" required><span class="sdk-hint"></span></label>
      <!-- one row: the type (host.ui.kindPicker: typing searches the name and other words, the categories are only its headings), then the
           icon and the colour, small buttons that open a searchable list and a list of the eight tints (each with a first entry to reset) -->
      <div class="look-row" id="f-look" role="group" aria-label="Type, icon and colour">
        <div class="look-type" id="f-type"></div>
        <button class="look-btn" type="button" id="f-icon" aria-haspopup="listbox" aria-expanded="false"><span class="ic" data-icon="location-dot"></span></button>
        <button class="look-btn" type="button" id="f-color" aria-haspopup="listbox" aria-expanded="false"><span class="look-dot"></span></button>
      </div>
      <!-- where it shows, and so where it is kept (plan-places-library.md, Part A): a tick per store open to the viewer
           (tpl-tick), other spaces under "More" on a space's canvas, and one line saying who will see it -->
      <fieldset id="f-where" class="sdk-section where" aria-describedby="f-where-line" hidden>
        <legend class="sdk-section-title">Shows in</legend>
        <div class="ticks" id="f-where-ticks"></div>
        <details class="where-more" id="f-where-more" hidden><summary data-slot="more">More</summary><div class="ticks" id="f-where-more-ticks"></div></details>
        <div class="ticks" id="f-where-mine"></div>
        <p class="where-line" id="f-where-line" aria-live="polite"></p>
        <p class="where-notes" id="f-where-notes" hidden></p>
      </fieldset>
      <label class="sdk-field"><span class="sdk-label">Address</span><input id="f-address" name="address" type="text" maxlength="200" autocomplete="off"><span class="sdk-hint"></span></label>
      <div class="sdk-field" role="group" aria-labelledby="f-point-label">
        <span class="sdk-label" id="f-point-label">Position</span>
        <!-- the button is shown only while a map is open beside: tucks the dialog away, the map waits for a click, the dialog comes back with the spot -->
        <span class="sdk-group"><input id="f-point" name="point" type="text" maxlength="200" placeholder="Paste coordinates or a map link (optional)" inputmode="decimal" autocomplete="off" aria-labelledby="f-point-label"><button class="sdk-icon-btn pick-point" type="button" id="f-pick" hidden aria-label="Pick the position on the map" data-tip="Click the map to set the position"><span class="ic" data-icon="crosshairs"></span></button></span>
        <span class="sdk-hint" id="f-point-note"></span>
      </div>
      <div class="sdk-field" role="group" aria-labelledby="f-status-label"><span class="sdk-label" id="f-status-label">Visit</span><div class="status-row" id="f-status"></div></div>
      <label class="sdk-field"><span class="sdk-label">Notes</span><textarea id="f-notes" name="notes" rows="3" maxlength="1000"></textarea><span class="sdk-hint"></span></label>
      <div class="sdk-field" role="group" aria-labelledby="f-owners-label"><span class="sdk-label" id="f-owners-label">Whose is it</span><div class="sdk-choice-list" id="f-owners"></div></div>
      <div class="editor-links" id="f-links-out">
        <a class="btn" id="f-open-in-maps" target="_blank" rel="noopener"><span class="ic" data-icon="arrow-up-right-from-square"></span> <span data-slot="label">Open in my maps app</span></a>
      </div>
      <div class="used-by" id="f-used-by" hidden><div class="used-by-title">Used by</div><div class="links" id="f-used-by-links"></div></div>
      <div class="sdk-hint" id="f-by"></div>
      <div class="sdk-form-error" id="f-error" role="alert" hidden></div>
      <div class="sdk-editor-actions">
        <button class="btn btn-danger" type="button" id="f-delete" hidden>Delete</button>
        <button class="btn btn-quiet" type="button" id="f-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="f-save">Save</button>
      </div>
    </form>
  </dialog>
</div>
<div id="list-loading" class="msg" aria-busy="true"><div class="sdk-skel-list"><div class="sdk-skel sdk-skel-block"></div><div class="sdk-skel sdk-skel-block"></div><div class="sdk-skel sdk-skel-block"></div></div></div>
<div id="list-msg" class="sdk-empty" hidden></div>
  </section>
</div>

<!-- ============================ templates ============================ -->

<!-- a pin: an HTML marker. data-kind is place (added in Maps), object (another module's object) or cluster (several close together).
     The script adds .selected for the pin whose summary is open, .dragging while a place is being moved, .draft for the new place's pin. -->
<template id="tpl-pin"><button class="pin" type="button"><span class="pin-body"><span class="ic" data-icon=""></span></span><span class="pin-badge" data-visit=""><span class="ic" data-icon=""></span></span><span class="pin-label" data-slot="label"></span></button></template>
<template id="tpl-pin-cluster"><button class="pin cluster" type="button" data-kind="cluster"><span class="pin-body" data-slot="count"></span></button></template>

<!-- the callout of the selected place: over the map, with what can be done. The script sets data-kind and data-cat. -->
<template id="tpl-callout"><div class="callout"><button class="sdk-icon-btn btn-quiet btn-small callout-close" type="button" data-action="close-callout" aria-label="Close"><span class="ic" data-icon="xmark"></span></button><h3 data-slot="title"></h3><p class="callout-where"><span data-slot="where"></span> <span class="coords" data-slot="coords"></span></p><p class="callout-source"><span class="ic" data-icon=""></span> <span data-slot="from"></span><button class="open-link" type="button" data-action="open" data-tip="Open it where it lives" aria-label="Open it where it lives"><span class="ic" data-icon="arrow-up-right-from-square"></span></button></p><div class="callout-actions"><a class="btn btn-small btn-primary" data-action="open-in-maps" target="_blank" rel="noopener"><span class="ic" data-icon="arrow-up-right-from-square"></span> <span data-slot="maps-label">Open in my maps app</span></a><button class="btn btn-small" type="button" data-action="copy-coords"><span class="ic" data-icon="copy"></span> Copy coordinates</button><button class="btn btn-small" type="button" data-action="show-in-list" hidden><span class="ic" data-icon="list"></span> Show in list</button></div></div></template>

<!-- a search result -->
<template id="tpl-result"><li><button class="result sdk-menu-item" type="button"><span class="ic sdk-menu-icon" data-icon="location-dot"></span><span class="sdk-menu-label" data-slot="title"></span><span class="sdk-menu-hint" data-slot="sub"></span></button></li></template>

<!-- states that replace the map; the script puts one of these in #state and un-hides it -->
<template id="tpl-state-loading"><div class="sdk-skel"></div></template>
<template id="tpl-state-nomap"><span class="ic" data-icon="map"></span><h2 class="sdk-empty-title"><span data-slot="own-name">Maps</span> is not set up yet</h2><p class="sdk-empty-text"><span data-word="owner" data-word-form="a cap"></span> ticks a map file in Manage. The file is first put in the data folder by whoever runs the server (the host does it when there are several <span data-word="environment" data-word-form="many"></span>). </p></template>
<template id="tpl-state-nowebgl"><span class="ic" data-icon="map"></span><h2 class="sdk-empty-title">This device cannot draw the map</h2><p class="sdk-empty-text">Your places are in the list<span data-slot="maps-app">, and each opens in your own maps app from there</span>.</p></template>
<template id="tpl-state-error"><span class="ic" data-icon="triangle-exclamation"></span><h2 class="sdk-empty-title">The map could not load</h2><p class="sdk-empty-text">The map file did not answer. Try again, or ask <span data-word="owner" data-word-form="a"></span> to check it.</p><div class="sdk-empty-actions"><button class="btn" type="button" data-action="retry">Try again</button></div></template>

<!-- ============================ templates ============================ -->

<template id="tpl-group"><section class="sdk-list-group"><h2 class="sdk-group-head"><span class="ic" data-icon=""></span><span data-slot="title"></span></h2><div class="sdk-list rows"></div></section></template>

<!-- a place: the shared banded card (Cards, system.css), the band its icon, its name and its menu. The element gets data-id and data-cat (a category id from the environment list; do, eat, stay, travel, other to start). -->
<template id="tpl-place">
  <article class="sdk-card-banded place-row" tabindex="0">
    <header class="sdk-card-head"><div class="sdk-card-main"><span class="sdk-card-icon"><span class="ic" data-icon=""></span></span><h3 class="sdk-card-title title" data-slot="title"></h3></div><button class="item-menu sdk-icon-btn btn-quiet btn-small" type="button" data-action="menu" aria-label="Place menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></header>
    <div class="sdk-card-body">
      <p class="sub" data-slot="address"></p>
      <div class="meta">
        <span class="scope-mark" hidden><span class="ic" data-icon=""></span><span data-slot="scope"></span></span>
        <span class="saved-state" data-slot="saved-state" hidden></span>
        <span class="marks" data-slot="marks" hidden></span>
        <span class="pinned" data-slot="pinned"><span class="ic" data-icon="location-dot"></span> <span class="pinned-text">On the map</span></span>
        <span class="nopos" data-slot="nopos">No position yet</span>
        <span class="visit" data-slot="visit" hidden><span class="ic" data-icon=""></span><span data-slot="word"></span></span>
        <span class="owners" data-slot="owners"></span>
        <span class="links" data-slot="links"></span>
      </div>
    </div>
  </article>
</template>
<!-- find a place: #found is a banded card, its band the heading ("Results for", the text, the close button), then the rows; a row is a result with a Save button -->
<template id="tpl-found-head"><header class="sdk-card-head found-head"><div class="sdk-card-main"><span class="sdk-card-sub" data-slot="label">Results for</span><b class="sdk-card-title" data-slot="query"></b></div><button class="found-close sdk-icon-btn btn-quiet btn-small" type="button" data-action="close-found" aria-label="Close results"><span class="ic" data-icon="xmark"></span></button></header></template>
<template id="tpl-found-row"><div class="found-row" role="option" tabindex="0"><span class="mark"><span class="ic" data-icon="location-dot"></span></span><div><h3 class="title" data-slot="title"></h3><p class="sub" data-slot="address"></p><p class="source" data-slot="source"></p></div><button class="btn btn-primary" type="button" data-action="save-found">Save</button></div></template>
<template id="tpl-found-searching"><div class="found-rows"><div class="sdk-skel-list" aria-busy="true"><div class="sdk-skel sdk-skel-block"></div><div class="sdk-skel sdk-skel-block"></div></div></div></template>
<template id="tpl-found-state"><p class="found-state" data-slot="text"></p></template>
<!-- visit status in the form: a toggle button per status (aria-pressed) -->
<template id="tpl-status-btn"><button class="status-btn" type="button" aria-pressed="false"><span class="ic" data-icon=""></span><span data-slot="label"></span></button></template>
<!-- a tick of Shows in: the checkbox, its name, and a hint (why it cannot be changed, or what Mine means) -->
<template id="tpl-tick"><label class="sdk-choice-row"><input type="checkbox"><span class="sdk-choice-text"><span class="sdk-choice-label" data-slot="label"></span><span class="sdk-choice-desc" data-slot="hint"></span></span></label></template>
<!-- a space a place is marked into, on its row (only the viewer's own spaces are named) -->
<template id="tpl-mark"><span class="space-mark"><span class="ic" data-icon="users"></span><span data-slot="name"></span></span></template>
<!-- asked before a change of ticks takes the place away from people -->
<template id="tpl-narrow"><div class="sdk-banner" data-kind="warn" data-bar="narrow" role="alert"><span class="sdk-banner-icon" data-icon="triangle-exclamation" aria-hidden="true"></span><span class="sdk-banner-text" data-slot="text"></span><button class="btn btn-small sdk-banner-action" type="button" data-action="keep-shared">Keep it shared</button><button class="btn btn-small btn-danger sdk-banner-action" type="button" data-action="take-away">Take it away</button></div></template>
<template id="tpl-owner"><span class="owner"></span></template>
<template id="tpl-link"><span class="link"><span class="ic" data-icon=""></span> <b data-slot="kind"></b> <span data-slot="title"></span></span></template>
<!-- asked when a new place repeats one already in the lists: Open it, or Save anyway -->
<template id="tpl-duplicate"><div class="sdk-banner" data-kind="warn" data-bar="duplicate" role="alert"><span class="sdk-banner-icon" data-icon="triangle-exclamation" aria-hidden="true"></span><span class="sdk-banner-text" data-slot="text"></span><button class="btn btn-small sdk-banner-action" type="button" data-action="open-duplicate">Open it</button><button class="btn btn-small sdk-banner-action" type="button" data-action="save-anyway">Save anyway</button></div></template>
<template id="tpl-conflict"><div class="sdk-banner" data-kind="warn" data-bar="conflict" role="alert"><span class="sdk-banner-icon" data-icon="triangle-exclamation" aria-hidden="true"></span><span class="sdk-banner-text" data-slot="text"></span><button class="btn btn-small sdk-banner-action" type="button" data-action="use-theirs">Use theirs</button><button class="btn btn-small sdk-banner-action" type="button" data-action="keep-mine">Keep mine</button></div></template>
<template id="tpl-readonly"><div class="readonly"><dl><dt>Type</dt><dd data-slot="type"></dd><dt>Visit</dt><dd data-slot="status"></dd><dt>Address</dt><dd data-slot="address"></dd><dt>Position</dt><dd data-slot="point"></dd><dt>Whose</dt><dd data-slot="owners"></dd></dl><p data-slot="notes"></p></div></template>

<template id="tpl-list-loading"><div class="sdk-skel-grid" aria-busy="true"><div class="sdk-skel sdk-skel-block"></div><div class="sdk-skel sdk-skel-block"></div><div class="sdk-skel sdk-skel-block"></div><div class="sdk-skel sdk-skel-block"></div></div></template>
<template id="tpl-state-empty"><div class="sdk-empty" id="state-empty"><span class="ic" data-icon="location-dot"></span><h2 class="sdk-empty-title" data-slot="title">No places yet</h2><p class="sdk-empty-text" data-slot="text">Save the places your group cares about: where you are staying, where to eat, what to see. Each can be found on the map and linked from a trip, an event or a task.</p><div class="sdk-empty-actions"><button class="btn btn-primary" type="button" data-action="add-place">Add a place</button></div></div></template>
<template id="tpl-state-none"><div class="sdk-empty" id="state-none"><p class="sdk-empty-text" data-slot="text"></p></div></template>
<template id="tpl-find-more"><p class="find-more"><button class="btn" type="button" data-action="find-new"><span class="ic" data-icon="magnifying-glass"></span> Search for new places</button></p></template>
<template id="tpl-state-noresults"><div class="sdk-empty" id="state-noresults"><h2 class="sdk-empty-title">Nothing matches</h2><p class="sdk-empty-text">No place matches your filter.</p><div class="sdk-empty-actions"><button class="btn btn-quiet" type="button" data-action="clear-filter">Show everything</button></div></div></template>

<script>
/*__JS__*/
</script>
</body>
</html>
