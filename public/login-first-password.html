<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1a2b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="/img/site/icon">
  <title>Choose your password</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-head.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/sdk/system.css">
</head>
<body data-brand="background">
  <!-- A new owner's first password (documentation/plans/plan-first-password.md). The address carries a one-time link
       in its fragment; login-first-password.js reads it, takes it out of the address at once and keeps it only in
       memory. This page loads no script but its own (and the app's own pieces it imports), and links nowhere outside
       this site. One of the three panels shows at a time. -->

  <!-- While the link is being opened, and when opening it could not be tried (too many tries, no connection). -->
  <section class="panel login" id="fp-wait" aria-labelledby="fp-wait-text">
    <div class="brand big"><img data-brand="icon" alt="" class="icon"><span data-brand="environmentName"></span></div>
    <p class="status" id="fp-wait-text" role="status">Opening your link...</p>
    <button class="btn btn-primary" type="button" id="fp-retry" hidden>Try again</button>
  </section>

  <form class="panel login" id="fp-choose" novalidate hidden aria-labelledby="fp-title">
    <div class="brand big"><img data-brand="icon" alt="" class="icon"><span data-brand="environmentName"></span></div>
    <h1 id="fp-title">Choose your password</h1>
    <p class="hint" id="fp-lede">Choose the password you will sign in with.</p>
    <!-- The login, for a password manager to save with the password. Not shown: the sentence above names it. -->
    <input id="fp-login" name="username" type="text" autocomplete="username" readonly hidden>
    <label>Password<span class="row reveal-row"><input id="fp-password" name="password" aria-label="Password" aria-describedby="fp-rule" type="password" required autocomplete="new-password" autocapitalize="off" spellcheck="false"><button class="btn btn-small" type="button" data-reveal="fp-password" aria-pressed="false">Show</button></span></label>
    <p class="hint" id="fp-rule">8 to 200 characters.</p>
    <button class="btn btn-primary" type="submit" id="fp-submit">Set password</button>
    <p class="status error" id="fp-error" role="alert" hidden></p>
    <span class="version" data-brand="version"></span>
  </form>

  <!-- Every failure of the link, the same words whatever the reason. -->
  <section class="panel login" id="fp-dead" hidden aria-labelledby="fp-dead-text">
    <div class="brand big"><img data-brand="icon" alt="" class="icon"><span data-brand="environmentName"></span></div>
    <p class="status error" id="fp-dead-text" role="alert"></p>
    <a class="btn" id="fp-signin" href="/login">Go to sign-in</a>
  </section>

  <script type="module" src="/login-first-password.js"></script>
</body>
</html>
