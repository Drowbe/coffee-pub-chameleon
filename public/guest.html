<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1a2b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:">
  <link rel="icon" href="/img/site/icon">
  <title>Welcome</title>
  <link rel="stylesheet" href="/fa/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-head.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/sdk/system.css">
</head>
<body data-brand="background">
  <!-- The guest's two screens (plan-access-bundle.md, step 4), drawn by guest.js from GET /api/guest-door. The landing (/guest)
       says who the visitor is and what a guest can't do, with Continue; Home (/guest#home) lists the spaces open to them. -->
  <main class="panel login login-step wide" id="guest">
    <div class="brand big"><img data-brand="icon" alt="" class="icon"><span data-brand="environmentName">Coffee Pub</span></div>
    <p class="hint" id="guest-hello"></p>
    <section id="guest-landing">
      <div class="sdk-banner" data-kind="info" id="guest-notice" role="note"><span class="sdk-banner-icon" aria-hidden="true"><i class="fa-solid fa-circle-info"></i></span><span class="sdk-banner-text"><span data-fill>As {a guest} you can't:</span><ul id="guest-unavailable"></ul></span></div>
      <div class="guest-actions">
        <button class="btn btn-primary" type="button" id="guest-continue">Continue</button>
      </div>
    </section>
    <section id="guest-home" hidden>
      <h2 id="guest-home-title"></h2>
      <div id="guest-spaces" class="guest-spaces" aria-live="polite"></div>
    </section>
    <p class="status error" id="guest-error" hidden></p>
    <div class="guest-actions guest-actions-end">
      <button class="btn btn-small btn-quiet" type="button" id="guest-leave">Leave</button>
    </div>
    <span class="version" data-brand="version"></span>
  </main>
  <script type="module" src="/guest.js"></script>
</body>
</html>
